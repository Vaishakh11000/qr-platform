[pytest]

# Test discovery
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ensure backend/app is importable
pythonpath = backend

# Reporting
addopts = -ra

# Test categories
markers =
    unit: tests that do not require external services
    integration: tests requiring database or external services
    api: HTTP-level API tests
