name: qr-platform-production

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      MEDIA_STORAGE_ROOT: /data/media
    volumes:
      - product_media:/data/media
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  public-web:
    build:
      context: ./public-web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  admin-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  proxy:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env}
      ADMIN_HOSTNAME: ${ADMIN_HOSTNAME:?Set ADMIN_HOSTNAME in .env}
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_HOSTNAME|ADMIN_HOSTNAME)$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    depends_on:
      public-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
    name: qr-platform-production-postgres-data
  product_media:
    name: qr-platform-production-product-media
