limit_req_zone $binary_remote_addr zone=lan_scan_start:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lan_scan_complete:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    location = /lan-root-ca.crt {
        alias /etc/nginx/certs/lan-root-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location = /lan-root-ca.mobileconfig {
        alias /etc/nginx/certs/lan-root-ca.mobileconfig;
        default_type application/x-apple-aspen-config;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 81;
    server_name _;
    return 301 https://$host:8444$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 110m;
    ssl_certificate /etc/nginx/certs/lan-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lan-server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "geolocation=(self)" always;

    location = /api/v1/public/scans/start {
        limit_req zone=lan_scan_start burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ~ ^/api/v1/public/scans/[^/]+/location$ {
        limit_req zone=lan_scan_complete burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /health { proxy_pass http://backend:8000/health; }
    location = /ready { proxy_pass http://backend:8000/ready; }

    location / {
        proxy_pass http://public-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 444 ssl;
    server_name _;
    client_max_body_size 110m;
    ssl_certificate /etc/nginx/certs/lan-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lan-server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /health { proxy_pass http://backend:8000/health; }
    location = /ready { proxy_pass http://backend:8000/ready; }

    location / {
        proxy_pass http://admin-web:80;
        proxy_set_header Host $host;
    }
}
